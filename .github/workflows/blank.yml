name: Build POP MBG Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Gradle directly. This project currently has no ./gradlew file.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan. Upload seluruh source code Android ke repository."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build Release APK (without wrapper)
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" clean assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: POP-MBG-Android-Release
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
